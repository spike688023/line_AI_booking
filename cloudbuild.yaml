steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/wellness-booking:${_DATE}-${_COMMIT_SHA}', '.']

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wellness-booking:${_DATE}-${_COMMIT_SHA}']

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wellness-booking'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wellness-booking:${_DATE}-${_COMMIT_SHA}'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'OAUTH_REDIRECT_BASE_URL=https://wellness-booking-ssrouqjf2q-de.a.run.app,GOOGLE_CLOUD_PROJECT=coffee-shop-agent-spike-2025'

images:
  - 'gcr.io/$PROJECT_ID/wellness-booking:${_DATE}-${_COMMIT_SHA}'
