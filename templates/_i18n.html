function i18nLang() {
  return localStorage.getItem('admin_lang') || 'en';
}

function i18nApply(lang) {
  const d = I18N[lang] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (d[k] !== undefined) el.textContent = d[k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const k = el.getAttribute('data-i18n-html');
    if (d[k] !== undefined) el.innerHTML = d[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const k = el.getAttribute('data-i18n-placeholder');
    if (d[k] !== undefined) el.placeholder = d[k];
  });
  const btn = document.getElementById('langToggleBtn');
  if (btn) btn.textContent = lang === 'en' ? '中文' : 'EN';
  document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
}

function i18nToggle() {
  const next = i18nLang() === 'en' ? 'zh' : 'en';
  localStorage.setItem('admin_lang', next);
  i18nApply(next);
}

function t(key, sub) {
  const s = (I18N[i18nLang()] || I18N.en)[key] || key;
  return sub !== undefined ? s.replace('{name}', sub) : s;
}

document.addEventListener('DOMContentLoaded', () => i18nApply(i18nLang()));
